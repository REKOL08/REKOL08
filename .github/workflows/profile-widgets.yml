name: Profile widgets

on:
  schedule:
    - cron: "0 5 * * *" # todos los días
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Serpiente de contribuciones → rama "output" ──
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tarjetas de estadísticas → carpeta profile-summary-card-output/ ──
  profile-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # La propia action genera las tarjetas y hace el commit/push a main
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -5 # hora de Colombia
